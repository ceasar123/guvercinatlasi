<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Güvercin Atlası: Türk güvercin ırkları atlası</title>
<meta name="description" content="Güvercin Atlası: Türkiye'nin güvercin ırkları, kaynaklarıyla. Taklacı, dönek, makaracı, posta ve form ırkları. Çok yakında.">
<style>
  :root{--parsomen:#f1e7d3;--murekkep:#1f1a14;--kirmizi:#9e2a2b;--soluk:#6e6050}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--parsomen);color:var(--murekkep);font-family:Georgia,"Times New Roman",serif;padding:24px}
  main{max-width:640px;text-align:center}
  .etiket{display:inline-block;background:var(--kirmizi);color:var(--parsomen);font:600 13px/1 system-ui,sans-serif;letter-spacing:.12em;padding:8px 12px;text-transform:uppercase}
  h1{font-size:clamp(40px,8vw,72px);margin:18px 0 8px;letter-spacing:.02em}
  p{font-size:19px;line-height:1.6;color:var(--soluk);margin:0 0 28px}
  a.dugme{display:inline-block;border:2px solid var(--murekkep);color:var(--murekkep);text-decoration:none;font:600 16px system-ui,sans-serif;padding:12px 20px}
  a.dugme:hover{background:var(--murekkep);color:var(--parsomen)}
  hr{border:0;border-top:1px solid #cdbfa5;margin:40px auto 16px;width:60%}
  small{color:var(--soluk);font-family:system-ui,sans-serif}
</style>
</head>
<body>
<main>
  <span class="etiket">Çok yakında</span>
  <h1>Güvercin Atlası</h1>
  <p>Türkiye'nin güvercin ırkları, kaynaklarıyla. Taklacılardan döneklere, makaracılardan posta güvercinlerine, her ırkın hikâyesi bir arada.</p>
  <a class="dugme" href="https://www.youtube.com/@guvercinatlasi">Belgeselleri YouTube'da izle</a>
  <hr>
  <small>© 2026 Güvercin Atlası</small>
</main>
</body>
</html>
